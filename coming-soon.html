<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="BLACK NOIR — Coming Soon">
    <title>BLACK NOIR | Coming Soon</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="./style.css">

    <!-- Coming Soon Specific Styles -->
    <style>
        .coming-soon-wrapper {
            height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #111;
            color: #fff;
            position: relative;
            overflow: hidden;
        }

        .coming-soon-logo {
            position: absolute;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            height: 45px;
            z-index: 10;
            object-fit: contain;
        }

        .coming-soon-content {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 30px;
            animation: heroFade 1.2s ease forwards;
        }

        .darker-overlay {
            background: linear-gradient(to bottom, rgba(0,0,0,0.6), rgba(0,0,0,0.85));
        }

        @media (max-width: 767px) {
            .coming-soon-logo {
                height: 35px;
                top: 25px;
            }
        }
    </style>
</head>
<body>

    <main class="coming-soon-wrapper">
        
        <!-- Reusing your zooming hero background -->
        <div class="hero-background" style="background-image: url('./%E2%81%A0images/Street.PNG');"></div>
        <div class="hero-overlay darker-overlay"></div>

        <!-- Top Logo (Links back to home) -->
        <a href="index.html" aria-label="Return to Home">
            <img src="./%E2%81%A0images/Logo.PNG" alt="BLACK NOIR" class="coming-soon-logo">
        </a>

        <!-- Content -->
        <div class="coming-soon-content">
            <p class="hero-eyebrow">BLACK NOIR / 2026</p>
            <h1 class="hero-title">Coming Soon</h1>
            <p class="hero-description" style="margin-bottom: 40px;">
                This collection is currently secured in the vault. <br>
                Check back soon for the official drop.
            </p>
            
            <!-- Button linking back to index -->
            <a href="index.html" class="btn-primary">RETURN HOME</a>
        </div>

    </main>

</body>
</html>
